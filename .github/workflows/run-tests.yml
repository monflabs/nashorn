name: Run Tests

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [25]

    steps:
    # Check out the repository code
    - name: Check out code
      uses: actions/checkout@v4

    # Set up Java environment
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
        cache: maven

    # Builds every module and runs the suite in both optimistic and
    # pessimistic modes. Also validates that the javadoc still builds, which
    # the Ant "test" target used to do as a side effect.
    - name: Build and run Nashorn tests
      run: mvn -B verify javadoc:javadoc

  test262:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [25]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
        cache: maven

    # The ECMA-262 suite is not vendored; fetch it, then run it through
    # ParallelTestRunner. Was "ant get-test262" + "ant test262-parallel".
    - name: Fetch the ECMA-262 suite
      run: mvn -B -Pfetch-externals -pl core generate-test-resources

    - name: Run ECMA-262 tests
      run: mvn -B -Ptest262 -DskipTests verify
