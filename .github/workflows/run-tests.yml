name: Run Tests

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [25]

    steps:
    # Check out the repository code
    - name: Check out code
      uses: actions/checkout@v4

    # Set up Java environment
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
        cache: maven

    # Builds every module and runs the suite in both optimistic and
    # pessimistic modes. Also validates that the javadoc still builds, which
    # the Ant "test" target used to do as a side effect.
    - name: Build and run Nashorn tests
      run: mvn -B verify javadoc:javadoc

  test262:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [25]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
        cache: maven

    # The ECMA-262 suite is not vendored; fetch it, then run it through
    # ParallelTestRunner. Was "ant get-test262" + "ant test262-parallel".
    # nasgen must be in the reactor: generate-test-resources runs core's
    # process-classes, which execs nasgen from buildtools/nasgen/target/classes;
    # -pl core alone never builds it, so include it explicitly.
    - name: Fetch the ECMA-262 suite
      run: mvn -B -Pfetch-externals -pl buildtools/nasgen,core generate-test-resources

    - name: Run ECMA-262 tests
      run: mvn -B -Ptest262 -DskipTests verify

  # Compares this revision against the perf-baseline tag - the last revision
  # measured before the ES2015 work began. Both sides are built and measured on
  # this runner, interleaved, because absolute milliseconds do not carry between
  # machines; see buildtools/perf-gate.sh.
  perf:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [25]

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        # perf-gate.sh builds the base revision from a worktree, so it needs the
        # history and the tag, not just the tip.
        fetch-depth: 0

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
        cache: maven

    - name: Check for the perf-baseline tag
      id: baseline
      run: |
        if git rev-parse --verify --quiet perf-baseline^{commit} >/dev/null; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No perf-baseline tag; skipping the performance gate." \
               "Create it with: git tag perf-baseline <commit> && git push origin perf-baseline"
        fi

    # Only octane's pdfjs.js is wanted here, for the compile-time benchmark.
    # Include nasgen: the fetch runs core's process-classes, which execs it.
    - name: Fetch the external suites
      if: steps.baseline.outputs.present == 'true'
      run: mvn -B -Pfetch-externals -pl buildtools/nasgen,core generate-test-resources

    - name: Compare against the baseline
      if: steps.baseline.outputs.present == 'true'
      # Five rounds rather than the local three: a shared runner is noisier than
      # a laptop, and the extra rounds cost minutes while a false failure costs
      # trust in the gate.
      env:
        PERF_ROUNDS: 5
      run: ./buildtools/perf-gate.sh
