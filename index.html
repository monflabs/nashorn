<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nashorn — OpenJDK-Monflabs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="vendor/vue.css">
</head>
<body>
  <div id="app">Loading documentation…</div>
  <script>
    window.$docsify = {
      name: 'Nashorn',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 3,
      maxLevel: 3,
      auto2top: true,
      relativePath: true,
      noEmoji: true,
      notFoundPage: false,
      search: { placeholder: 'Search', noData: 'No results', maxLevel: 3, depth: 3 }
    };
  </script>
  <script src="vendor/docsify.min.js"></script>
  <script src="vendor/search.min.js"></script>
  <script src="vendor/prism-java.min.js"></script>
  <script src="vendor/prism-bash.min.js"></script>
  <script src="vendor/prism-json.min.js"></script>
</body>
</html>
